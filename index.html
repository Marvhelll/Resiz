<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e1306c">
  <meta name="description" content="Redimensionne tes photos au format carré Instagram">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="stylesheet" href="styles.css?v=5">
  <title>Resiz</title>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#e1306c"/>
              <stop offset="100%" stop-color="#405de6"/>
            </linearGradient>
          </defs>
          <rect width="100" height="100" rx="22" fill="url(#logoGrad)"/>
          <rect x="15" y="27" width="43" height="34" rx="5"
                stroke="white" stroke-width="6" fill="none"/>
          <path d="M64 15 H83 V34"
                stroke="white" stroke-width="6"
                stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M36 85 H17 V66"
                stroke="white" stroke-width="6"
                stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <span>Resiz</span>
      </div>
      <button id="btn-install" class="btn btn-outline" hidden>Installer l'app</button>
    </div>
  </header>

  <main>

    <!-- ── Drop zone (état initial) ── -->
    <section id="drop-zone" aria-label="Zone d'import">
      <input type="file" id="file-input" accept="image/*" multiple aria-label="Choisir des images">
      <div class="drop-content">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p class="drop-title">Glisse tes images ici</p>
        <p class="drop-sub">ou</p>
        <button class="btn btn-primary" id="btn-pick">Choisir des images</button>
        <p class="drop-formats">JPG, PNG, WEBP, HEIC… · Plusieurs fichiers acceptés</p>
      </div>
    </section>

    <!-- ── Éditeur batch (caché au départ) ── -->
    <div id="editor" hidden>

      <!-- Sidebar : liste des vignettes -->
      <aside id="sidebar">
        <div id="thumb-list"></div>
        <button id="btn-add" class="btn-add-more" title="Ajouter des images">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Ajouter
        </button>
      </aside>

      <!-- Canvas : carousel -->
      <div id="canvas-area">
        <div id="carousel-nav">
          <button id="btn-prev" class="btn-nav" aria-label="Image précédente">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <span id="carousel-counter">1 / 1</span>
          <button id="btn-next" class="btn-nav" aria-label="Image suivante">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>

        <div class="canvas-wrapper">
          <canvas id="preview" width="480" height="480" aria-label="Prévisualisation"></canvas>
        </div>

        <p class="drag-hint">Tu peux glisser d'autres images ici pour les ajouter</p>
      </div>

      <!-- Contrôles fixes -->
      <div id="controls">

        <div class="control-group">
          <label class="control-label">
            Zoom
            <div class="zoom-value-wrap">
              <input type="number" id="zoom-input" min="10" max="200" value="100" aria-label="Valeur du zoom">
              <span class="input-unit">%</span>
            </div>
          </label>
          <div class="slider-row">
            <span class="slider-bound">10%</span>
            <input type="range" id="zoom-slider" min="10" max="200" step="1" value="100" aria-label="Zoom">
            <span class="slider-bound">200%</span>
          </div>
          <button id="btn-reset-zoom" class="btn btn-ghost btn-sm">Remettre à 100%</button>
        </div>

        <div class="divider"></div>

        <div class="control-group">
          <label class="control-label">Taille d'export</label>
          <select id="export-size" aria-label="Taille en pixels">
            <option value="1080">1080 px — standard Instagram</option>
            <option value="1200">1200 px — haute qualité</option>
            <option value="1500">1500 px — très haute qualité</option>
            <option value="custom">Personnalisé...</option>
          </select>
          <div id="custom-size-wrapper" hidden>
            <input type="number" id="custom-size" min="100" max="5000" placeholder="ex : 800" aria-label="Taille personnalisée">
            <span class="input-unit">px</span>
          </div>
        </div>

        <div class="divider"></div>

        <div class="control-group">
          <label class="control-label">Format</label>
          <div class="format-radio">
            <label class="radio-label">
              <input type="radio" name="format" value="jpg" checked> JPG
            </label>
            <label class="radio-label">
              <input type="radio" name="format" value="png"> PNG
            </label>
          </div>
        </div>

        <div class="divider"></div>

        <div class="control-group">
          <label class="control-label">Fond</label>
          <div class="bg-type-tabs">
            <button id="bg-tab-color" class="bg-tab active">Couleur</button>
            <button id="bg-tab-image" class="bg-tab">Image</button>
          </div>

          <!-- Couleur -->
          <div id="bg-color-panel">
            <div class="color-presets">
              <button class="color-preset" data-color="#ffffff" style="background:#ffffff" title="Blanc"></button>
              <button class="color-preset" data-color="#000000" style="background:#000000" title="Noir"></button>
              <button class="color-preset" data-color="#f5f0e8" style="background:#f5f0e8" title="Crème"></button>
              <button class="color-preset" data-color="#dce8f5" style="background:#dce8f5" title="Bleu clair"></button>
              <button class="color-preset" data-color="#f5dce8" style="background:#f5dce8" title="Rose"></button>
              <button class="color-preset" data-color="#ddf5dc" style="background:#ddf5dc" title="Vert clair"></button>
            </div>
            <label class="color-picker-wrap">
              <span>Personnalisé</span>
              <input type="color" id="bg-color" value="#ffffff">
            </label>
          </div>

          <!-- Image -->
          <div id="bg-image-panel" hidden>
            <button id="btn-pick-bg" class="btn btn-ghost btn-sm" style="width:100%">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              Choisir une image
            </button>
            <input type="file" id="file-input-bg" accept="image/*" hidden>
            <p id="bg-image-name" class="bg-image-name">Aucune image choisie</p>

            <label class="control-label" style="margin-top:.6rem">
              Taille <span id="bg-size-val" class="slider-val">100%</span>
            </label>
            <input type="range" id="bg-size" min="10" max="300" step="1" value="100">

            <label class="control-label" style="margin-top:.6rem">
              Rotation <span id="bg-rotation-val" class="slider-val">0°</span>
            </label>
            <input type="range" id="bg-rotation" min="0" max="360" step="1" value="0">

            <label class="control-label" style="margin-top:.6rem">
              Flou <span id="bg-blur-val" class="slider-val">0 px</span>
            </label>
            <input type="range" id="bg-blur" min="0" max="40" step="1" value="0">
          </div>
        </div>

        <div class="divider"></div>

        <div class="control-group">
          <button id="btn-zip" class="btn btn-primary btn-zip">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <span id="btn-zip-label">Télécharger ZIP</span>
          </button>
          <button id="btn-single" class="btn btn-outline btn-sm">
            Photo en cours seulement
          </button>
          <p id="export-info" class="export-info">Export : 1080 × 1080 px</p>
        </div>

      </div>
    </div>

  </main>

  <!-- Inputs fichiers cachés -->
  <input type="file" id="file-input-add" accept="image/*" multiple hidden>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="app.js?v=5"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
